spring:
  application:
    name: neurosys-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:${MYSQL_PUBLIC_URL:jdbc:mysql://${MYSQLHOST:${MYSQL_HOST:localhost}}:${MYSQLPORT:${MYSQL_PORT:3306}}/${MYSQLDATABASE:${MYSQL_DATABASE:railway}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:root}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:Karthik@2005}}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /

neurosys:
  app:
    jwt-secret: ${NEUROSYS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
    jwt-expiration-ms: 604800000 # 7 Days
    jwt-refresh-expiration-ms: 604800000 # 7 Days
  ai-service:
    url: ${NEUROSYS_AI_SERVICE_URL:http://localhost:8000}
  ai:
    provider: ${NEUROSYS_AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
  alerts:
    cpu:
      warning-threshold: ${CPU_WARNING_THRESHOLD:85.0}
      warning-duration-seconds: ${CPU_WARNING_DURATION:300}
      critical-threshold: ${CPU_CRITICAL_THRESHOLD:95.0}
      critical-duration-seconds: ${CPU_CRITICAL_DURATION:600}
      recovery-threshold: ${CPU_RECOVERY_THRESHOLD:75.0}
    memory:
      warning-threshold: ${MEMORY_WARNING_THRESHOLD:90.0}
      warning-duration-seconds: ${MEMORY_WARNING_DURATION:300}
      critical-threshold: ${MEMORY_CRITICAL_THRESHOLD:95.0}
      critical-duration-seconds: ${MEMORY_CRITICAL_DURATION:600}
      recovery-threshold: ${MEMORY_RECOVERY_THRESHOLD:80.0}
      critical-free-mb: ${MEMORY_CRITICAL_FREE_MB:1024.0}
    disk:
      info-threshold: ${DISK_INFO_THRESHOLD:80.0}
      warning-threshold: ${DISK_WARNING_THRESHOLD:90.0}
      critical-threshold: ${DISK_CRITICAL_THRESHOLD:95.0}
      urgent-threshold: ${DISK_URGENT_THRESHOLD:98.0}
      recovery-threshold: ${DISK_RECOVERY_THRESHOLD:80.0}
    offline:
      warning-state-seconds: ${OFFLINE_WARNING_DURATION:60}
      alert-duration-seconds: ${OFFLINE_CRITICAL_DURATION:300}

telemetry:
  collection:
    interval: ${TELEMETRY_COLLECTION_INTERVAL:1s}
  history:
    interval: ${TELEMETRY_HISTORY_INTERVAL:30s}
    retention-days: ${TELEMETRY_HISTORY_RETENTION_DAYS:7}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
